# zkindle settings. Edit, then restart zkindle (double-tap, then start it again).
# Lines starting with # are ignored.

# light | dark  (bottom tap toggles it; the choice is remembered in the "state" file)
theme = light

# dashboard | classic | minimal  (top tap cycles through them, also remembered in "state")
layout = dashboard

# Wallpapers: put PNG/JPG files in this folder. 1072x1448 grayscale looks best on a KT6.
# Leave the folder empty for a plain background.
wallpaper_dir = wallpapers
# Change wallpaper every N minutes (0 = always the first one, in name order)
wallpaper_minutes = 30
# White (or black, in dark theme) cards behind text so it stays readable on photos
cards = yes

# Weather from wttr.in, refreshed every 30 min while Wi-Fi is on. Empty = no weather.
city = Creteil

# Your public GitHub activity this week. Empty = off.
github_user = ayoubMah

# A countdown to a date:  countdown = Label | YYYY-MM-DD
# countdown = CKA exam | 2027-01-15

# Full flashing refresh every N minutes, to clear e-ink ghosting
flash_every = 15

# If tapping the top changes the theme instead of the layout, your panel is mirrored: set this to yes
flip_touch = no
